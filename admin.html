<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolce Coffee - Admin Orders</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { padding: 120px 8% 50px; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .section-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0 15px;
        }

        .section-title {
            color: var(--primary-lime-dark);
            font-size: 1.4rem;
            margin: 0;
        }

        .completed-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .select-all-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .order-card {
            background: #fff;
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
        }
        .order-card.completed-card {
            background: #fdfdfd;
            border-color: #e2e8f0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-soft);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .order-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .status-RECEIVED { background: #fef3c7; color: #d97706; }
        .status-PREPARING { background: #dbeafe; color: #2563eb; }
        .status-COMPLETED { background: #dcfce7; color: #15803d; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--primary-lime);
            background: var(--bg-accent);
            color: var(--primary-lime-dark);
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-status:hover { background: var(--primary-lime); color: #fff; }

        .btn-delete {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #ef4444;
            background: #fef2f2;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-delete:hover { background: #dc2626; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Dolce <span class="highlight">Admin</span></div>
        <button class="cart-trigger-btn" onclick="fetchOrders()">Refresh Orders</button>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h2>Order Management Dashboard</h2>
        </div>

        <!-- Active Orders Section -->
        <div class="section-header-container">
            <h3 class="section-title">Ongoing and Preparing Orders</h3>
        </div>
        <div id="active-orders-list">Loading orders...</div>

        <br><hr style="border: 0; border-top: 1px solid var(--border-soft);"><br>

        <!-- Completed Orders Section -->
        <div class="section-header-container">
            <h3 class="section-title" style="color: var(--text-muted);">Completed Orders History</h3>
            <div class="completed-actions">
                <label class="select-all-label">
                    <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)"> Select All
                </label>
                <button class="btn-delete" id="delete-selected-btn" onclick="deleteSelectedOrders()">Delete Selected</button>
            </div>
        </div>
        <div id="completed-orders-list">Loading completed orders...</div>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:8080/api/v1/orders";
        let selectedOrderIds = new Set();

        function fetchOrders() {
            fetch(API_BASE_URL)
                .then(res => {
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    return res.json();
                })
                .then(orders => {
                    const activeContainer = document.getElementById("active-orders-list");
                    const completedContainer = document.getElementById("completed-orders-list");

                    activeContainer.innerHTML = "";
                    completedContainer.innerHTML = "";

                    const activeOrders = orders.filter(o => o.status !== "COMPLETED");
                    const completedOrders = orders.filter(o => o.status === "COMPLETED");

                    if (activeOrders.length === 0) {
                        activeContainer.innerHTML = "<p style='color: var(--text-muted);'>No active incoming orders.</p>";
                    } else {
                        activeOrders.forEach(order => activeContainer.appendChild(createOrderCard(order, false)));
                    }

                    if (completedOrders.length === 0) {
                        completedContainer.innerHTML = "<p style='color: var(--text-muted);'>No completed orders in history.</p>";
                        document.getElementById("select-all-checkbox").checked = false;
                        selectedOrderIds.clear();
                    } else {
                        completedOrders.forEach(order => completedContainer.appendChild(createOrderCard(order, true)));
                    }
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    document.getElementById("active-orders-list").innerHTML = "<p style='color:red;'>Error connecting to backend API. Ensure Spring Boot backend is running.</p>";
                    document.getElementById("completed-orders-list").innerHTML = "";
                });
        }

        function createOrderCard(order, isCompleted) {
            let itemsHtml = order.items.map(i => `<li>${i.name} x${i.quantity} - ${(i.price * i.quantity).toFixed(2)} ETB</li>`).join('');

            let receiptHtml = "";
            if (order.paymentReceipt) {
                const advance = order.advanceAmount ? order.advanceAmount.toFixed(2) : (order.totalAmount * 0.5).toFixed(2);
                receiptHtml = `
                    <div style="margin-top: 12px; padding: 12px; background: #f8fafc; border: 1px solid var(--border-soft); border-radius: 8px;">
                        <small style="font-weight: bold; color: #dc2626; display: block; margin-bottom: 4px;">Advance Deposit Paid (50%): ${advance} ETB</small>
                        <a href="${order.paymentReceipt}" target="_blank" style="font-size: 0.85rem; color: #2563eb; text-decoration: underline; font-weight: 600;">🖼️ View Payment Screenshot / Receipt</a>
                    </div>
                `;
            }

            const card = document.createElement("div");
            card.className = `order-card ${isCompleted ? 'completed-card' : ''}`;

            let actionButtons = "";
            let checkboxHtml = "";

            if (!isCompleted) {
                actionButtons = `
                    <button class="btn-status" onclick="updateStatus('${order.orderId}', 'PREPARING')">Mark Preparing</button>
                    <button class="btn-status" onclick="updateStatus('${order.orderId}', 'COMPLETED')">Mark Completed</button>
                `;
            } else {
                const isChecked = selectedOrderIds.has(order.orderId) ? "checked" : "";
                checkboxHtml = `<input type="checkbox" class="order-checkbox completed-item-checkbox" value="${order.orderId}" ${isChecked} onchange="toggleSelectOrder('${order.orderId}', this.checked)">`;
                actionButtons = `
                    <button class="btn-delete" onclick="deleteSingleOrder('${order.orderId}')">Delete Order</button>
                `;
            }

            card.innerHTML = `
                <div class="order-header">
                    <div class="header-left">
                        ${checkboxHtml}
                        <div>
                            <h3>Order ID: ${order.orderId} (${order.orderType})</h3>
                            <small style="color: var(--text-muted);">${order.timestamp}</small>
                        </div>
                    </div>
                    <span class="status-badge status-${order.status}">${order.status}</span>
                </div>
                <ul style="margin: 15px 0 15px 20px;">${itemsHtml}</ul>
                <h4>Total: ${order.totalAmount.toFixed(2)} ETB</h4>
                ${receiptHtml}
                <div class="action-btns">${actionButtons}</div>
            `;

            return card;
        }

        function updateStatus(orderId, newStatus) {
            fetch(`${API_BASE_URL}/${orderId}/status`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update status");
                return res.json();
            })
            .then(() => fetchOrders())
            .catch(err => console.error("Error updating status:", err));
        }

        function toggleSelectOrder(orderId, isChecked) {
            if (isChecked) {
                selectedOrderIds.add(orderId);
            } else {
                selectedOrderIds.delete(orderId);
            }
        }

        function toggleSelectAll(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.completed-item-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = masterCheckbox.checked;
                if (masterCheckbox.checked) {
                    selectedOrderIds.add(cb.value);
                } else {
                    selectedOrderIds.delete(cb.value);
                }
            });
        }

        function deleteSingleOrder(orderId) {
            const confirmed = confirm(`Are you sure you want to delete Order ${orderId}? This action cannot be undone.`);
            if (!confirmed) return;

            sendDeleteRequest(orderId).then(() => {
                selectedOrderIds.delete(orderId);
                fetchOrders();
            });
        }

        function deleteSelectedOrders() {
            if (selectedOrderIds.size === 0) {
                alert("Please select at least one completed order to delete.");
                return;
            }

            const confirmed = confirm(`Are you sure you want to delete ${selectedOrderIds.size} selected order(s)? This action cannot be undone.`);
            if (!confirmed) return;

            const deletePromises = Array.from(selectedOrderIds).map(id => sendDeleteRequest(id));
            Promise.all(deletePromises)
                .then(() => {
                    selectedOrderIds.clear();
                    fetchOrders();
                })
                .catch(err => console.error("Error deleting orders:", err));
        }

        function sendDeleteRequest(orderId) {
            return fetch(`${API_BASE_URL}/${orderId}`, {
                method: "DELETE"
            })
            .then(res => {
                if (!res.ok) throw new Error("Failed to delete order " + orderId);
                return res.json();
            })
            .catch(err => console.error("Error deleting order:", err));
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchOrders();
            setInterval(fetchOrders, 5000);
        });
    </script>
</body>
</html>
